<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malla Interactiva - Contador Público</title>

<!-- Fuentes lindas cursivas -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:20px;
    background: linear-gradient(135deg,#f8c8dc,#d6e6f2);
    font-family: 'Quicksand', sans-serif;
    color:#3a2e39;
}

h1{
    text-align:center;
    font-family:'Dancing Script', cursive;
    font-size:42px;
    margin-bottom:30px;
    color:#7a4069;
}

.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.year{
    background:#ffffffaa;
    backdrop-filter: blur(6px);
    padding:15px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.year h2{
    text-align:center;
    font-family:'Dancing Script', cursive;
    color:#a64d79;
}

.materia{
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    font-size:14px;
}

.materia.disponible{
    background:#ffe6f2;
}

.materia.aprobada{
    background:#b8e0d2;
    text-decoration:line-through;
}

.materia.bloqueada{
    background:#e0c3d6;
    opacity:0.6;
    cursor:not-allowed;
}

.footer{
    margin-top:20px;
    text-align:center;
    font-size:14px;
}
</style>
</head>

<body>

<h1>Malla Interactiva - Contador Público</h1>

<div class="grid" id="malla"></div>

<div class="footer">
Progreso guardado automáticamente 💾
</div>

<script>
const STORAGE_KEY = "malla_contador_pastel";

const materias = [
{ id:1, nombre:"Introducción a las Ciencias Sociales", año:1, req:[] },
{ id:2, nombre:"Introducción a la Economía", año:1, req:[] },
{ id:3, nombre:"Introducción a la Administración", año:1, req:[] },
{ id:4, nombre:"Derecho constitucional y administrativo", año:1, req:[] },
{ id:5, nombre:"Introducción a la Contabilidad", año:1, req:[] },
{ id:6, nombre:"Introducción a la Matemática", año:1, req:[] },
{ id:7, nombre:"Derecho Privado", año:1, req:[] },

{ id:8, nombre:"Sistemas y Procedimientos Administrativos", año:2, req:[3] },
{ id:9, nombre:"Macroeconomía", año:2, req:[1,2] },
{ id:10, nombre:"Contabilidad 1", año:2, req:[5] },
{ id:11, nombre:"Matemática para Contadores", año:2, req:[6] },
{ id:12, nombre:"Contabilidad 2", año:2, req:[10] },
{ id:13, nombre:"Microeconomía", año:2, req:[1,2] },
{ id:14, nombre:"Métodos Estadísticos", año:2, req:[11] },
{ id:15, nombre:"Derecho Comercial", año:2, req:[7] },

{ id:16, nombre:"Contabilidad 3", año:3, req:[12] },
{ id:17, nombre:"Tecnología de la Información", año:3, req:[8] },
{ id:18, nombre:"Finanzas Públicas", año:3, req:[4,9] },
{ id:19, nombre:"Sociedades y Asociaciones", año:3, req:[15] },
{ id:20, nombre:"Matemática Financiera", año:3, req:[11] },
{ id:21, nombre:"Costos", año:3, req:[8,14] },
{ id:22, nombre:"Relaciones Laborales y de la Seguridad Social", año:3, req:[4] },
{ id:23, nombre:"Contabilidad 4", año:3, req:[16] },

{ id:24, nombre:"Impuestos 1", año:4, req:[16,18] },
{ id:25, nombre:"Contabilidad 5", año:4, req:[23] },
{ id:26, nombre:"Información para la Gestión", año:4, req:[17,21] },
{ id:27, nombre:"Estructura y Política Económica Argentina", año:4, req:[18,13] },
{ id:28, nombre:"Administración y Contabilidad Pública", año:4, req:[8,12,18] },
{ id:29, nombre:"Práctica Profesional de Aplicación Jurídica", año:4, req:[22,23,19] },
{ id:30, nombre:"Administración Financiera", año:4, req:[8,14,20] },

{ id:31, nombre:"Impuestos 2", año:5, req:[24,22,19] },
{ id:32, nombre:"Auditoría", año:5, req:[17,21,23,19,22] },
{ id:33, nombre:"Práctica Profesional de Aplicación Administrativo Contable", año:5, req:[17,19,22,25] },
{ id:34, nombre:"Asignaturas Optativas", año:5, req:[] },
{ id:35, nombre:"Concursos", año:5, req:[17,19,22,23,29] },
{ id:36, nombre:"Asignaturas Electivas", año:5, req:[] },
{ id:37, nombre:"Práctica Profesional Supervisada", año:5, req:[] }
];

let aprobadas = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)) || []);

function guardar(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...aprobadas]));
}

function desbloqueada(m){
    return m.req.every(r => aprobadas.has(r));
}

function render(){
    const cont = document.getElementById("malla");
    cont.innerHTML="";

    for(let año=1;año<=5;año++){
        const divAño = document.createElement("div");
        divAño.className="year";
        divAño.innerHTML=`<h2>${año}° Año</h2>`;

        materias.filter(m=>m.año===año).forEach(m=>{
            const div = document.createElement("div");
            div.className="materia";

            if(aprobadas.has(m.id)){
                div.classList.add("aprobada");
            } else if(!desbloqueada(m)){
                div.classList.add("bloqueada");
            } else{
                div.classList.add("disponible");
            }

            div.textContent = m.id+". "+m.nombre;

            div.onclick=()=>{
                if(!desbloqueada(m) && !aprobadas.has(m.id)) return;
                if(aprobadas.has(m.id)) aprobadas.delete(m.id);
                else aprobadas.add(m.id);
                guardar();
                render();
            };

            divAño.appendChild(div);
        });

        cont.appendChild(divAño);
    }
}

render();
</script>

</body>
</html>
